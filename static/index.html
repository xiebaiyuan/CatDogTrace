<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DogCatTrace：在浏览器本地对整数序列做品种归因">
  <meta name="theme-color" content="#faf9f6">
  <title>DogCatTrace</title>
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./repository-link.css">
</head>
<body>

  <header class="topbar">
    <span class="brand">DogCatTrace</span>
    <div class="topbar-meta">
      <span id="topbar-bank-count">正在读取指纹库</span>
      <a class="topbar-link" href="https://github.com/xiebaiyuan/CatDogTrace" target="_blank" rel="noopener noreferrer">代码仓库</a>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>品种归因</h1>
      <p class="hero-lede">把一段整数序列和 24 个犬猫品种的数字指纹逐一对齐，算它最像谁。计算在本地完成，序列不离开这台机器。</p>
      <p class="hero-status"><span id="active-bank-badge">正在读取指纹库</span><span class="sep">·</span>本地计算</p>
    </section>

    <section class="section workspace">
      <div class="section-head">
        <h2 class="section-title">工作区</h2>
        <button id="regenerate" class="btn btn-quiet" type="button" disabled>重新生成挑战</button>
      </div>
      <div id="challenge-list" class="challenges" aria-live="polite">
        <div class="skeleton-challenge"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div>
        <div class="skeleton-challenge"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div>
        <div class="skeleton-challenge"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div>
      </div>
      <div class="action-row">
        <button id="analyze" class="btn btn-primary" type="button" disabled>计算归因概率</button>
      </div>
      <p id="test-message" class="message working">正在读取指纹库……</p>
      <section id="result" class="result" hidden aria-live="polite"></section>
    </section>

    <section class="section roster-section">
      <div class="section-head">
        <h2 class="section-title">候选名册</h2>
      </div>
      <p class="section-note">闭集候选：指纹库里的 24 只犬猫。库外品种也会被归到最相似的一只，概率不为零。</p>
      <div id="roster-grid" class="roster" aria-busy="true">
        <div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div>
        <div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div>
        <div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div>
        <div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div><div class="skeleton skeleton-tile"></div>
      </div>
    </section>

    <footer class="page-footer">
      <span class="footer-method">方法：有序块特征 + nuisance-Hellinger 融合，softmax 温度由分组交叉验证确定。</span>
      <a class="repository-link" href="https://github.com/xiebaiyuan/CatDogTrace" target="_blank" rel="noopener noreferrer">代码仓库</a>
      <a class="repository-link" href="https://linux.do/" target="_blank" rel="noopener noreferrer">LINUX DO</a>
    </footer>
  </main>

  <script type="module" src="./pages-app.js"></script>
</body>
</html>
